{% extends 'base.html' %}
{% block title %}收貨核對｜統家便利店{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/fulfillment.css') }}">
<section class="fulfillment-app" data-role="manager">
  <h1>收貨核對</h1>
  <p>請依實際到貨核對。預填數量尚未入庫，按確認後才會更新庫存。</p>
  <label>門市 <select id="fulfillment-store"></select></label>
  <label>訂單 <select id="fulfillment-order"></select></label>
  <button id="fulfillment-refresh" type="button">重新整理</button>
  <div id="fulfillment-error" role="alert"></div>
  <div id="fulfillment-detail"></div>
</section>
<script src="{{ url_for('static', filename='js/fulfillment.js') }}" defer></script>
{% endblock %}
