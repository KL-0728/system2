{% extends 'base.html' %}{% block content %}
<h1>登入</h1><p>{% if business_time %}請使用自己的示範帳號。密碼由本機種子設定提供。{% else %}請使用管理者提供的帳號與密碼。{% endif %}</p>
{% if login_error %}<p class="login-error" role="alert">{{ login_error }}</p>{% endif %}
<form method="post" action="/api/auth/login">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<input type="hidden" name="next" value="{{ next_url or '/' }}">
<label for="username">帳號</label><input id="username" name="username" value="{{ username or '' }}" autocomplete="username" maxlength="80" required>
<label for="password">密碼</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required>
<button type="button" class="password-toggle" data-password-toggle="password" aria-controls="password" aria-pressed="false">顯示密碼</button></div>
<button type="submit">登入</button></form>{% endblock %}
